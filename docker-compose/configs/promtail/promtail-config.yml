server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover all running containers via the Docker socket and ship their
  # stdout/stderr logs to Loki, labeled by container name + compose project.
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service

  # Host system logs (optional — journald not always mountable, kept simple
  # for cross-platform/WSL2 compatibility)
  - job_name: host-syslog
    static_configs:
      - targets: ["localhost"]
        labels:
          job: syslog
          __path__: /var/log/*log
