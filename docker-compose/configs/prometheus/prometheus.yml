global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: observability-platform

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules/*.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host-metrics

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: container-metrics

  - job_name: custom-exporter
    static_configs:
      - targets: ["custom-exporter:9200"]
        labels:
          component: custom-exporter

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: otel-collector

  # Blackbox: probes target-app's /health endpoint over HTTP. Uses the
  # standard blackbox relabeling pattern — the actual scrape target is
  # blackbox-exporter itself, with the real URL passed as a `target` param.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://target-app:8000/health
        labels:
          component: endpoint-probe
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
