version: "3.9"

name: observability-platform

# ---------------------------------------------------------------------------
# observability-platform — full local stack (Stages 1-5)
# Metrics: Prometheus, node-exporter, cadvisor, custom-exporter
# Logs:    Loki, Promtail
# Traces:  Tempo, OTel Collector, target-app (instrumented)
# Alerts:  Alertmanager, blackbox-exporter, webhook-receiver (stub)
# Data:    Postgres (backing store for target-app / custom-exporter demo)
#
# Kubernetes equivalents are in ../kubernetes/ (Stage 6).
# Dashboard JSON files live in ../dashboards/ (Stage 7 finalizes all 7).
# ---------------------------------------------------------------------------

networks:
  obs-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  postgres-data:

services:

  # ==================== METRICS ====================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./configs/prometheus:/etc/prometheus
      - ../alert-rules:/etc/prometheus/alert-rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - obs-net
    depends_on:
      - node-exporter
      - cadvisor

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - obs-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    networks:
      - obs-net

  custom-exporter:
    build:
      context: ../custom-exporter
    container_name: custom-exporter
    restart: unless-stopped
    ports:
      - "9200:9200"
    networks:
      - obs-net

  # ==================== LOGS ====================

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - obs-net

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    networks:
      - obs-net
    depends_on:
      - loki

  # ==================== TRACES ====================

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./configs/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "32000:3200"
      - "4317:4317"
    networks:
      - obs-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./configs/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4318:4318"
    networks:
      - obs-net
    depends_on:
      - tempo
      - loki
      - prometheus

  target-app:
    build:
      context: ../target-app
    container_name: target-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - obs-net
    depends_on:
      - otel-collector
      - postgres

  load-generator:
    image: curlimages/curl:8.8.0
    container_name: load-generator
    restart: unless-stopped
    depends_on:
      - target-app
    networks:
      - obs-net
    entrypoint: >
      sh -c "while true; do
        curl -s -o /dev/null http://target-app:8000/work;
        curl -s -o /dev/null http://target-app:8000/error-prone;
        curl -s -o /dev/null http://target-app:8000/slow;
        sleep 2;
      done"

  # ==================== DATA STORE ====================

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-obs_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_local_only}
      - POSTGRES_DB=${POSTGRES_DB:-obs_metrics}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - obs-net

  # ==================== ALERTING ====================

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - obs-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./configs/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - obs-net

  webhook-receiver:
    build:
      context: ../webhook-receiver
    container_name: webhook-receiver
    restart: unless-stopped
    ports:
      - "8090:8080"
    networks:
      - obs-net

  # ==================== DASHBOARDS ====================

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme_local_only}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - obs-net
    depends_on:
      - prometheus
      - loki
      - tempo
