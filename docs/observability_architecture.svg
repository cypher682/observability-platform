<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2a4a"/>
      <stop offset="100%" style="stop-color:#1a3f6f"/>
    </linearGradient>
    
    <linearGradient id="collectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1b4d"/>
      <stop offset="100%" style="stop-color:#4c2f85"/>
    </linearGradient>
    
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f3a2c"/>
      <stop offset="100%" style="stop-color:#325d47"/>
    </linearGradient>
    
    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2f0f"/>
      <stop offset="100%" style="stop-color:#7c4e18"/>
    </linearGradient>

    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0f1a"/>
      <stop offset="100%" style="stop-color:#7d182b"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f87171"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff07" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="860" fill="url(#grid)"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="75" fill="#161b22" opacity="0.95"/>
  <rect x="0" y="73" width="1200" height="2" fill="#eab308" opacity="0.7"/>

  <!-- Logo Icon -->
  <rect x="36" y="16" width="42" height="42" rx="8" fill="#eab308" opacity="0.9"/>
  <text x="57" y="43" text-anchor="middle" font-size="18" fill="#0d1117" font-weight="900">LG</text>

  <!-- Header Text -->
  <text x="96" y="36" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="0.5">observability-platform</text>
  <text x="96" y="58" font-size="12" fill="#94a3b8">Full LGTM Stack · Prometheus · Grafana · Loki · Tempo · OTel Collector · Alertmanager · Custom Exporter</text>

  <!-- Deployment targets badges -->
  <rect x="910" y="24" width="125" height="24" rx="12" fill="#2563eb" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="972" y="40" text-anchor="middle" font-size="11" fill="#60a5fa" font-weight="600">🐳 Docker Compose</text>

  <rect x="1048" y="24" width="115" height="24" rx="12" fill="#0891b2" opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="1105" y="40" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="600">☸️ Minikube K8s</text>

  <!-- ─────────────────────────── SECTION 1: INSTRUMENTED APPS ─────────────────────────── -->
  <rect x="40" y="110" width="270" height="520" rx="16" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="110" width="270" height="36" rx="16" fill="#1f2937" opacity="0.8"/>
  <text x="175" y="133" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700" letter-spacing="1">TELEMETRY SOURCES</text>

  <!-- Load Generator -->
  <rect x="58" y="162" width="234" height="74" rx="10" fill="url(#appGrad)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="74" y="184" font-size="9" fill="#94a3b8">SYNTHETIC TRAFFIC</text>
  <text x="74" y="204" font-size="14" font-weight="700" fill="#93c5fd">load-generator</text>
  <text x="74" y="218" font-size="9.5" fill="#bfdbfe">Alpine &amp; curl loops</text>

  <!-- target-app (FastAPI) -->
  <rect x="58" y="252" width="234" height="152" rx="10" fill="url(#appGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="74" y="274" font-size="9" fill="#94a3b8">CORE APPLICATION</text>
  <text x="74" y="294" font-size="15" font-weight="700" fill="#60a5fa">target-app (FastAPI)</text>
  <text x="74" y="312" font-size="10.5" fill="#e2e8f0">Instrumented with OTel Python SDK</text>
  <text x="74" y="335" font-size="9" fill="#94a3b8">Exports: Traces (OTLP/gRPC)</text>
  <text x="74" y="347" font-size="9" fill="#94a3b8">Structured logs with trace_id</text>
  <text x="74" y="359" font-size="9" fill="#94a3b8">Endpoints: /work, /slow, /error-prone</text>
  <rect x="74" y="372" width="202" height="20" rx="4" fill="#1e3a8a" opacity="0.4"/>
  <text x="175" y="385" text-anchor="middle" font-size="9" fill="#93c5fd">SQLAlchemy Auto-traced (Postgres)</text>

  <!-- custom-exporter -->
  <rect x="58" y="420" width="234" height="106" rx="10" fill="url(#appGrad)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="74" y="442" font-size="9" fill="#94a3b8">CUSTOM BUSINESS METRICS</text>
  <text x="74" y="462" font-size="14" font-weight="700" fill="#93c5fd">custom-exporter</text>
  <text x="74" y="480" font-size="10" fill="#e2e8f0">Hand-written Python exporter</text>
  <text x="74" y="498" font-size="9" fill="#94a3b8">Metric format: Prometheus exposition</text>
  <text x="74" y="510" font-size="9" fill="#94a3b8">Simulated queue depths &amp; success ratios</text>

  <!-- Database -->
  <rect x="58" y="542" width="234" height="74" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="74" y="562" font-size="9" fill="#94a3b8">DATA STORAGE</text>
  <text x="74" y="582" font-size="13" font-weight="700" fill="#cbd5e1">Postgres DB</text>
  <text x="74" y="598" font-size="9" fill="#94a3b8">Backing store for SQLAlchemy trace demo</text>

  <!-- ─────────────────────────── SECTION 2: COLLECTION / PIPELINE ─────────────────────────── -->
  <rect x="360" y="110" width="280" height="520" rx="16" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="360" y="110" width="280" height="36" rx="16" fill="#1f2937" opacity="0.8"/>
  <text x="500" y="133" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700" letter-spacing="1">COLLECTION PIPELINE</text>

  <!-- OpenTelemetry Collector -->
  <rect x="378" y="162" width="244" height="152" rx="10" fill="url(#collectorGrad)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="394" y="184" font-size="9" fill="#cbd5e1">CENTRAL INGESTION</text>
  <text x="394" y="206" font-size="15" font-weight="700" fill="#ddd6fe">OTel Collector</text>
  <text x="394" y="224" font-size="10.5" fill="#f5f3ff">Unified telemetry proxy</text>
  <text x="394" y="246" font-size="9.5" fill="#c084fc">Receives: OTLP gRPC (:4317)</text>
  <text x="394" y="258" font-size="9.5" fill="#c084fc">Receives: OTLP HTTP (:4318)</text>
  <text x="394" y="278" font-size="9.5" fill="#cbd5e1">Exports: Traces to Tempo</text>
  <text x="394" y="290" font-size="9.5" fill="#cbd5e1">Exports: Metrics remote-write</text>

  <!-- Promtail -->
  <rect x="378" y="330" width="244" height="74" rx="10" fill="url(#collectorGrad)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="394" y="352" font-size="9" fill="#cbd5e1">LOG HARVESTER</text>
  <text x="394" y="372" font-size="14" font-weight="700" fill="#ddd6fe">Promtail</text>
  <text x="394" y="388" font-size="9.5" fill="#cbd5e1">Reads /var/run/docker.sock to Loki</text>

  <!-- Infrastructure Exporters -->
  <rect x="378" y="420" width="244" height="196" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="394" y="442" font-size="9" fill="#818cf8">SYSTEM METRICS EXPORTERS</text>
  <text x="394" y="464" font-size="14" font-weight="700" fill="#c7d2fe">Infrastructure Exporters</text>
  
  <rect x="394" y="478" width="212" height="34" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="404" y="492" font-size="10" font-weight="600" fill="#e0e7ff">node-exporter</text>
  <text x="404" y="504" font-size="8.5" fill="#a5b4fc">Host CPU, Mem, Disk, Network (:9100)</text>

  <rect x="394" y="520" width="212" height="34" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="404" y="534" font-size="10" font-weight="600" fill="#e0e7ff">cAdvisor</text>
  <text x="404" y="546" font-size="8.5" fill="#a5b4fc">Container resource limits / stats (:8085)</text>

  <rect x="394" y="562" width="212" height="42" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="404" y="576" font-size="10" font-weight="600" fill="#e0e7ff">blackbox-exporter</text>
  <text x="404" y="590" font-size="8.5" fill="#a5b4fc">Active HTTP probe of target-app (:9115)</text>

  <!-- ─────────────────────────── SECTION 3: STORAGE BACKENDS ─────────────────────────── -->
  <rect x="690" y="110" width="230" height="520" rx="16" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="690" y="110" width="230" height="36" rx="16" fill="#1f2937" opacity="0.8"/>
  <text x="805" y="133" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700" letter-spacing="1">STORAGE &amp; DB LAYER</text>

  <!-- Tempo -->
  <rect x="708" y="162" width="194" height="110" rx="10" fill="url(#storageGrad)" stroke="#10b981" stroke-width="1.2"/>
  <text x="724" y="184" font-size="9" fill="#bfdbfe">TRACES BACKEND</text>
  <text x="724" y="206" font-size="15" font-weight="700" fill="#a7f3d0">Tempo</text>
  <text x="724" y="222" font-size="10" fill="#e2e8f0">Object storage traces</text>
  <text x="724" y="238" font-size="9" fill="#6ee7b7">TraceQL capability</text>
  <text x="724" y="250" font-size="9" fill="#94a3b8">Linked to Loki logs</text>

  <!-- Loki -->
  <rect x="708" y="292" width="194" height="110" rx="10" fill="url(#storageGrad)" stroke="#10b981" stroke-width="1.2"/>
  <text x="724" y="314" font-size="9" fill="#bfdbfe">LOGS BACKEND</text>
  <text x="724" y="336" font-size="15" font-weight="700" fill="#a7f3d0">Loki</text>
  <text x="724" y="352" font-size="10" fill="#e2e8f0">Label-indexed logs</text>
  <text x="724" y="368" font-size="9" fill="#6ee7b7">LogQL log queries</text>
  <text x="724" y="380" font-size="9" fill="#94a3b8">Derived trace_id links</text>

  <!-- Prometheus -->
  <rect x="708" y="420" width="194" height="196" rx="10" fill="url(#storageGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="724" y="442" font-size="9" fill="#bfdbfe">METRICS ENGINE</text>
  <text x="724" y="466" font-size="16" font-weight="700" fill="#34d399">Prometheus</text>
  <text x="724" y="484" font-size="10.5" fill="#e2e8f0">TSDB metrics engine</text>
  <text x="724" y="508" font-size="9.5" fill="#a7f3d0">Scrapes: node, cadvisor, custom-exporter</text>
  <text x="724" y="528" font-size="9.5" fill="#a7f3d0">Receives: Remote Write from OTel Collector</text>
  <text x="724" y="556" font-size="9" fill="#f87171" font-weight="600">Evaluates Alert Rules</text>
  <text x="724" y="570" font-size="8.5" fill="#94a3b8">7 rules in rules.yml</text>
  <text x="724" y="582" font-size="8.5" fill="#94a3b8">High CPU, Memory, 5xx rate</text>

  <!-- ─────────────────────────── SECTION 4: VISUALIZATION ─────────────────────────── -->
  <rect x="960" y="110" width="200" height="230" rx="16" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="960" y="110" width="200" height="36" rx="16" fill="#1f2937" opacity="0.8"/>
  <text x="1060" y="133" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700" letter-spacing="1">VISUALIZATION</text>

  <!-- Grafana -->
  <rect x="970" y="162" width="180" height="162" rx="10" fill="url(#grafanaGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="982" y="184" font-size="8.5" fill="#fed7aa">SINGLE PANE OF GLASS</text>
  <text x="982" y="206" font-size="16" font-weight="700" fill="#fbbf24">Grafana</text>
  <text x="982" y="222" font-size="10" fill="#e2e8f0">Dashboards-as-Code</text>
  <text x="982" y="238" font-size="8.5" fill="#fbbf24">Federates Prometheus/Loki/Tempo</text>
  <text x="982" y="260" font-size="9" fill="#a7f3d0">Trace-to-Log Correlation</text>
  <text x="982" y="272" font-size="9" fill="#a7f3d0">Trace-to-Metrics Links</text>
  <text x="982" y="284" font-size="9" fill="#a7f3d0">Exemplar integration</text>
  <text x="982" y="296" font-size="8.5" fill="#f3f4f6">7 Auto-Provisioned Dashboards</text>

  <!-- ─────────────────────────── SECTION 5: ALERTING & ROUTING ─────────────────────────── -->
  <rect x="960" y="370" width="200" height="260" rx="16" fill="#111827" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="960" y="370" width="200" height="36" rx="16" fill="#1f2937" opacity="0.8"/>
  <text x="1060" y="393" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700" letter-spacing="1">ALERT ROUTING</text>

  <!-- Alertmanager -->
  <rect x="970" y="420" width="180" height="110" rx="10" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="982" y="442" font-size="8.5" fill="#fca5a5">ALERT ENGINE</text>
  <text x="982" y="464" font-size="15" font-weight="700" fill="#fca5a5">Alertmanager</text>
  <text x="982" y="480" font-size="9" fill="#e2e8f0">Inhibition &amp; Routing rules</text>
  <text x="982" y="492" font-size="9" fill="#ef4444" font-weight="600">Routes: Severity Warning / Critical</text>
  <text x="982" y="504" font-size="8.5" fill="#cbd5e1">Integrations: Webhook stubs</text>

  <!-- Webhook Receiver -->
  <rect x="970" y="542" width="180" height="74" rx="10" fill="#1f1f2e" stroke="#818cf8" stroke-width="1"/>
  <text x="982" y="562" font-size="8.5" fill="#cbd5e1">VERIFICATION STUB</text>
  <text x="982" y="582" font-size="13" font-weight="700" fill="#c7d2fe">webhook-receiver</text>
  <text x="982" y="598" font-size="9" fill="#94a3b8">Captures JSON alert payloads</text>


  <!-- ─────────────────────────── TELEMETRY CONNECTIONS (LINES) ─────────────────────────── -->

  <!-- Load Gen -> target app -->
  <path d="M 292 200 L 330 200 L 330 290 L 292 290" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>
  <text x="325" y="240" font-size="8.5" fill="#60a5fa" transform="rotate(90,325,240)">http traffic</text>

  <!-- SQLAlchemy -> Postgres -->
  <path d="M 175 404 L 175 542" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowGray)"/>
  <text x="180" y="480" font-size="9" fill="#94a3b8">SQL calls</text>

  <!-- target-app -> otel collector -->
  <path d="M 292 312 L 378 238" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="325" y="265" font-size="8" fill="#a78bfa">OTLP traces</text>

  <!-- target-app logs -->
  <path d="M 292 360 L 338 360 L 338 385 L 378 385" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="330" y="352" font-size="8" fill="#f472b6">container stdout</text>

  <!-- custom-exporter -> prometheus -->
  <path d="M 292 480 L 338 480 L 338 520 L 708 520" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="348" y="475" font-size="9" fill="#f59e0b">scraped /metrics</text>

  <!-- otel collector -> Tempo -->
  <path d="M 622 200 L 708 200" fill="none" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="655" y="193" font-size="9" fill="#60a5fa">traces</text>

  <!-- otel collector -> prometheus (remote write) -->
  <path d="M 622 250 L 670 250 L 670 460 L 708 460" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="650" y="320" font-size="8" fill="#a78bfa" transform="rotate(90,650,320)">remote write metrics</text>

  <!-- promtail -> Loki -->
  <path d="M 622 360 L 708 360" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="655" y="352" font-size="9" fill="#f472b6">push logs</text>

  <!-- exporters -> prometheus -->
  <path d="M 622 560 L 708 560" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="655" y="552" font-size="9" fill="#f59e0b">scrapes</text>

  <!-- Prometheus -> Alertmanager -->
  <path d="M 802 616 L 802 650 L 920 650 L 920 480 L 970 480" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="820" y="642" font-size="9" fill="#ef4444">alerts trigger</text>

  <!-- Alertmanager -> webhook stub -->
  <path d="M 1060 530 L 1060 542" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="1065" y="538" font-size="8.5" fill="#818cf8">POST payload</text>

  <!-- Backends -> Grafana -->
  <path d="M 902 230 L 938 230 L 938 200 L 970 200" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 902 340 L 970 230" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 902 500 L 948 500 L 948 260 L 970 260" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="944" y="325" font-size="8.5" fill="#94a3b8" transform="rotate(90,944,325)">datasources</text>

</svg>
