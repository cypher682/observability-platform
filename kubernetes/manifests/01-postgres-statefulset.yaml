# Demonstrates: StatefulSet + PersistentVolumeClaim (via volumeClaimTemplates)
# + ConfigMap + resource limits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: observability
data:
  POSTGRES_DB: obs_metrics
  POSTGRES_USER: obs_admin
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: observability
type: Opaque
stringData:
  # Local/dev only — use a real Secret manager (Sealed Secrets, SOPS,
  # External Secrets Operator) before this ever touches a shared cluster.
  POSTGRES_PASSWORD: changeme_local_only
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: observability
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: observability
spec:
  clusterIP: None    # headless — standard pattern for StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
