# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n observability --create-namespace -f kube-prometheus-stack-values.yaml
#
# Sized for a local minikube dev cluster — NOT production sizing.

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    additionalScrapeConfigs:
      - job_name: custom-exporter
        static_configs:
          - targets: ["custom-exporter.observability.svc.cluster.local:9200"]
      - job_name: target-app
        static_configs:
          - targets: ["target-app.observability.svc.cluster.local:8000"]
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      receiver: default-warning
      group_by: ["alertname", "component"]
      routes:
        - matchers: ["severity=critical"]
          receiver: critical-immediate
        - matchers: ["severity=warning"]
          receiver: default-warning
    receivers:
      - name: default-warning
        webhook_configs:
          - url: "http://webhook-receiver.observability.svc.cluster.local:8080/warning"
      - name: critical-immediate
        webhook_configs:
          - url: "http://webhook-receiver.observability.svc.cluster.local:8080/critical"

grafana:
  adminUser: admin
  adminPassword: changeme_local_only     # override via --set or a Secret for anything beyond local
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: observability-platform
          folder: ""
          type: file
          options:
            path: /var/lib/grafana/dashboards/observability-platform
  # Dashboard JSONs are mounted via a separate ConfigMap in practice, or via
  # the sidecar pattern (grafana.sidecar.dashboards.enabled: true) which
  # watches ConfigMaps labeled grafana_dashboard=1 — recommended over
  # inlining JSON in values for anything beyond a couple dashboards.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
